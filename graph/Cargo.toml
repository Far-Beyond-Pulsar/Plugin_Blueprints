[package]
name = "blueprint_graph"
version = "0.1.0"
edition = "2021"
description = "GPUI-free authored Blueprint graph schema and library model"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
