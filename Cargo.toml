[package]
name = "blueprint_editor_plugin"
version = "0.5.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "blueprint_editor_plugin"

[dependencies]
# Plugin API (local checkout used when developing against Pulsar-Native)
plugin_editor_api = { path = "../Pulsar-Native/crates/plugin_editor_api" }

# UI dependencies (local paths so traits resolve to the same crate instance)
gpui-ce = { git = "https://github.com/Far-Beyond-Pulsar/WGPUI", rev = "0b555af11e80565429af9405ffd9d17fa832e3fe" }
ui = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "12de1ffafea31832d39b9cf5e90e5cf8e44f4e18" }
ui_common = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "12de1ffafea31832d39b9cf5e90e5cf8e44f4e18" }

# Blueprint editor dependencies (local paths)
pulsar_std = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "12de1ffafea31832d39b9cf5e90e5cf8e44f4e18" }
engine_backend = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "12de1ffafea31832d39b9cf5e90e5cf8e44f4e18" }
pulsar_reflection = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "12de1ffafea31832d39b9cf5e90e5cf8e44f4e18" }

# Blueprint executor — bytecode VM path
pulsar_std_bundle = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "12de1ffafea31832d39b9cf5e90e5cf8e44f4e18" }
pulsar_bp_executor = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "12de1ffafea31832d39b9cf5e90e5cf8e44f4e18" }

# Compiler graph types — same revs as used by blueprint_compiler in Pulsar-Native
graphy = { git = "https://github.com/Far-Beyond-Pulsar/Graphy", rev = "944b114e79f88b44eecd493a000e95ce0ce6b5bd" }
pbgc = { git = "https://github.com/Far-Beyond-Pulsar/PBGC", rev = "67d675e7b678e29041d51068aee4a5737dcb67da" }
# Utilities
uuid = { version = "1.0", features = ["v4"] }
smol = "2.0"
log = "0.4"
tracing = "0.1.41"
chrono = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
schemars = "1.0"

# For async operations
futures = "0.3"
arboard = "3.4"
anyhow = "1.0"
tool_registry = { git = "https://github.com/Far-Beyond-Pulsar/ToolbeltRS", rev = "116b9028bad6b9467073de2534be60ef4df9b279" }
tool_registry_macros = { git = "https://github.com/Far-Beyond-Pulsar/ToolbeltRS", rev = "116b9028bad6b9467073de2534be60ef4df9b279" }

# Force windows 0.62 to match wgpu-hal and avoid gpu-allocator version conflict
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }
parking_lot = "0.12"