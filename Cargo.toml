[package]
name = "blueprint_editor_plugin"
version = "0.5.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "blueprint_editor_plugin"

[[example]]
name = "standalone"
path = "examples/standalone.rs"

[[example]]
name = "standalone_stress"
path = "examples/standalone_stress.rs"


[dependencies]
# UI dependencies (local paths so traits resolve to the same crate instance)
gpui-ce = { git = "https://github.com/Far-Beyond-Pulsar/WGPUI", rev = "3458d987317e30f6cda800e03822292e27ef4a33" }
ui      = { git = "https://github.com/Far-Beyond-Pulsar/WGPUI-Component", rev = "3e386a01cf3e0e3c0f86eed7f3e3b9835ce54f70" }


plugin_editor_api = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "4728db2110593fa55534918709dc974a22fd27b7" }
ui_common          = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "4728db2110593fa55534918709dc974a22fd27b7" }
pulsar_std         = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "4728db2110593fa55534918709dc974a22fd27b7" }
engine_backend     = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "4728db2110593fa55534918709dc974a22fd27b7" }
pulsar_reflection  = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "4728db2110593fa55534918709dc974a22fd27b7" }
pulsar_std_bundle  = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "4728db2110593fa55534918709dc974a22fd27b7" }
pulsar_bp_executor = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "4728db2110593fa55534918709dc974a22fd27b7" }

# Compiler graph types — same revs as used by blueprint_compiler in Pulsar-Native
graphy = { git = "https://github.com/Far-Beyond-Pulsar/Graphy", rev = "d18837c13dd3e1cf6076d9a3c64c450971a6d1af" }
pbgc = { git = "https://github.com/Far-Beyond-Pulsar/PBGC", rev = "2e627b0d36d764ef6d2002c1c176e83776dbf735" }
# Utilities
uuid = { version = "1.0", features = ["v4"] }
smol = "2.0"
log = "0.4"
tracing = "0.1.41"
chrono = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
schemars = "1.0"

# For async operations
futures = "0.3"
arboard = "3.4"
anyhow = "1.0"
wgpu = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", rev = "fce5b80e8017304449124b12637ec324417e40c8", default-features = false, features = ["dx12", "vulkan", "wgsl", "metal"] }
parking_lot = "0.12"
fontdue = "0.9"
bytemuck = { version = "1", features = ["derive"] }
tool_registry = { git = "https://github.com/Far-Beyond-Pulsar/ToolbeltRS", rev = "116b9028bad6b9467073de2534be60ef4df9b279" }
tool_registry_macros = { git = "https://github.com/Far-Beyond-Pulsar/ToolbeltRS", rev = "116b9028bad6b9467073de2534be60ef4df9b279" }

# Force windows 0.62 to match wgpu-hal and avoid gpu-allocator version conflict
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }
parking_lot = "0.12"
