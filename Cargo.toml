[package]
name = "blueprint_editor_plugin"
version = "0.7.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "blueprint_editor_plugin"
test = false
doctest = false

[[example]]
name = "standalone"
path = "examples/standalone.rs"
test = false

[features]
# Pulsar statically links this crate when it is used as a built-in editor.
# Dynamic plugin builds keep the loader ABI exports by default.
builtin = ["dep:plugin_manager"]

[dependencies]
# The plugin's descriptor and its editor provider's registration.
pulsar_plugins = { workspace = true }
engine_fs = { workspace = true }
editor_task_queue = { workspace = true }
ui_types_common = { workspace = true }
graphy-blueprint = { workspace = true }
graphy-gpui = { path = "../../../crates/third-party/graphy/crates/graphy-gpui", features = ["gpui"] }
graphy-render = { path = "../../../crates/third-party/graphy/crates/graphy-render" }
graphy-render-wgpu = { path = "../../../crates/third-party/graphy/crates/graphy-render-wgpu" }
# Resolve every public UI and engine type through one current Pulsar revision.
# Mixing the standalone WGPUI repositories with Pulsar's re-exports creates
# distinct Cargo package identities for otherwise identical GPUI types.
gpui-ce = { workspace = true }
ui      = { workspace = true }

plugin_editor_api = { workspace = true }
# Only for the built-in provider (feature `builtin`): registers this editor at link time.
plugin_manager = { workspace = true, optional = true }
ui_common          = { workspace = true }
engine_backend     = { workspace = true }
# The one prefab model (`prefab.json`), with its record migrations on load.
pulsar_class       = { workspace = true }
pulsar_reflection  = { workspace = true }
# The `#[blueprint]` node registry the palette and graph checks read.
pulsar_std         = { workspace = true }

# Compiler graph types paired with the current Blueprint integration.
graphy = { workspace = true }
# Graph -> engine script module compiler (this repository's `compiler/`).
blueprint_compiler = { path = "compiler" }
pulsar_script_vm = { workspace = true }
# Exports a compiled class as Rust (the Rust compile target).
pulsar_script_codegen = { workspace = true }
# Utilities
uuid = { version = "1.0", features = ["v4"] }
smol = "2.0"
log = "0.4"
tracing = "0.1.41"
chrono = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "2.0", features = ["full"] }
schemars = "1.0"

# For async operations
futures = "0.3"
arboard = "3.4"
anyhow = "1.0"
wgpu = { version = "30.0.0", default-features = false, features = [
    "web",
    "webgpu",
    "dx12",
    "vulkan",
    "wgsl",
] }
parking_lot = "0.12"
tool_registry = { workspace = true }
tool_registry_macros = { workspace = true }

# Force windows 0.62 to match wgpu-hal and avoid gpu-allocator version conflict
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }
parking_lot = "0.12"
