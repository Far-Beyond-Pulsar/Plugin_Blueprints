[package]
name = "blueprint_editor_plugin"
version = "0.4.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "blueprint_editor_plugin"

[dependencies]
# Plugin API (local — same binary, no DLL boundary)
plugin_editor_api = { path = "E:/Documents/GitHub/genesis/Pulsar-Native/crates/plugin_editor_api" }

# UI dependencies (local paths so traits resolve to the same crate instance)
gpui-ce = { git = "https://github.com/Far-Beyond-Pulsar/WGPUI", rev = "08a00b072e394fffb0f7e461997338f1e515f267" }
ui = { path = "E:/Documents/GitHub/genesis/Pulsar-Native/crates/ui" }
ui_common = { path = "E:/Documents/GitHub/genesis/Pulsar-Native/ui-crates/ui_common" }

# Blueprint editor dependencies (local paths)
pulsar_std = { path = "E:/Documents/GitHub/genesis/Pulsar-Native/crates/pulsar_std" }
engine_backend = { path = "E:/Documents/GitHub/genesis/Pulsar-Native/crates/engine_backend" }

# Compiler graph types — same revs as used by blueprint_compiler in Pulsar-Native
graphy = { git = "https://github.com/Far-Beyond-Pulsar/Graphy", rev = "74a993fe51efc00ac5e208af74a3df79f2c0ba47" }
pbgc = { git = "https://github.com/Far-Beyond-Pulsar/PBGC", rev = "20f71a4c0d3bcac3eee221ea8255c008e4d891fb" }
# Utilities
uuid = { version = "1.0", features = ["v4"] }
smol = "2.0"
log = "0.4"
tracing = "0.1.41"
chrono = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
schemars = "1.0"

# For async operations
futures = "0.3"
arboard = "3.4"

# Force windows 0.62 to match wgpu-hal and avoid gpu-allocator version conflict
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }
