[package]
name = "blueprint_editor_plugin"
version = "0.7.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "blueprint_editor_plugin"
test = false
doctest = false

[[example]]
name = "standalone"
path = "examples/standalone.rs"
test = false

[[example]]
name = "standalone_stress"
path = "examples/standalone_stress.rs"
test = false

# Headless spatial-index benchmark (#1072): candidate counts and per-query
# times for large graphs. Manual only, no CI gate.
[[example]]
name = "spatial_index_stress"
path = "examples/spatial_index_stress.rs"
test = false

[features]
# Pulsar statically links this crate when it is used as a built-in editor.
# Dynamic plugin builds keep the loader ABI exports by default.
builtin = ["dep:plugin_manager"]

[dependencies]
engine_fs = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "6868a0378f85b846a809490617d17404a7b4082c" }
editor_task_queue = { path = "../../../crates/core/editor_task_queue" }
ui_types_common = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b" }
blueprint_graph = { path = "graph" }
# Resolve every public UI and engine type through one current Pulsar revision.
# Mixing the standalone WGPUI repositories with Pulsar's re-exports creates
# distinct Cargo package identities for otherwise identical GPUI types.
gpui-ce = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b" }
ui      = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b" }

plugin_editor_api = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b" }
# Only for the built-in provider (feature `builtin`): registers this editor at link time.
plugin_manager = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b", optional = true }
ui_common          = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b" }
engine_backend     = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b" }
pulsar_reflection  = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b" }

# Compiler graph types paired with the current Blueprint integration.
graphy = { git = "https://github.com/Far-Beyond-Pulsar/Graphy", rev = "c43924070aa0955302f8015708625be279da77a7" }
pbgc = { git = "https://github.com/Far-Beyond-Pulsar/PBGC", rev = "8739ed4b9d4acc362887a3d6414d3ff96c880f4f" }
# Graph -> engine script module compiler (this repository's `compiler/`).
blueprint_compiler = { path = "compiler" }
pulsar_script_vm = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b" }
# Exports a compiled class as Rust (the Rust compile target).
pulsar_script_codegen = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b" }
# Utilities
uuid = { version = "1.0", features = ["v4"] }
smol = "2.0"
log = "0.4"
tracing = "0.1.41"
chrono = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
syn = { version = "2.0", features = ["full"] }
schemars = "1.0"

# For async operations
futures = "0.3"
arboard = "3.4"
anyhow = "1.0"
wgpu = { version = "30.0.0", default-features = false, features = [
    "web",
    "webgpu",
    "dx12",
    "vulkan",
    "wgsl",
] }
parking_lot = "0.12"
rstar = "0.12.2"
fontdue = "0.9"
bytemuck = { version = "1", features = ["derive"] }
tool_registry = { git = "https://github.com/Far-Beyond-Pulsar/ToolbeltRS", rev = "116b9028bad6b9467073de2534be60ef4df9b279" }
tool_registry_macros = { git = "https://github.com/Far-Beyond-Pulsar/ToolbeltRS", rev = "116b9028bad6b9467073de2534be60ef4df9b279" }

# Force windows 0.62 to match wgpu-hal and avoid gpu-allocator version conflict
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }
parking_lot = "0.12"

[patch."https://github.com/Far-Beyond-Pulsar/WGPUI"]
gpui-ce = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b" }

[patch."https://github.com/Far-Beyond-Pulsar/WGPUI-Component"]
ui = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b" }
ui-macros = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b" }

[patch."https://github.com/Far-Beyond-Pulsar/Pulsar-Native"]
pulsar_reflection = { path = "../../../crates/external/pulsar-reflection/crates/pulsar_reflection" }
pulsar_reflection_derive = { path = "../../../crates/external/pulsar-reflection/crates/pulsar_reflection_derive" }
pulsar_reflection_codegen = { path = "../../../crates/external/pulsar-reflection/crates/pulsar_reflection_codegen" }
pulsar_script_vm = { path = "../../../crates/core/pulsar_script_vm" }
pulsar_script_codegen = { path = "../../../crates/core/pulsar_script_codegen" }
pulsar_world_registry = { path = "../../../crates/core/pulsar_world_registry" }

# Match the workspace SceneDB revision so `World`/`ComponentId`/`Pod` types
# keep a single identity across the engine and Helio.
[patch."https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection"]
pulsar_reflection = { path = "../../../crates/external/pulsar-reflection/crates/pulsar_reflection" }
pulsar_reflection_derive = { path = "../../../crates/external/pulsar-reflection/crates/pulsar_reflection_derive" }
pulsar_reflection_codegen = { path = "../../../crates/external/pulsar-reflection/crates/pulsar_reflection_codegen" }

[patch."https://github.com/Far-Beyond-Pulsar/SceneDB"]
pulsar_scenedb = { git = "https://github.com//Far-Beyond-Pulsar/SceneDB", rev = "685b1b0aa212b64912549efd583c93480bea027f" }
pulsar_scenedb_derive = { git = "https://github.com//Far-Beyond-Pulsar/SceneDB", rev = "685b1b0aa212b64912549efd583c93480bea027f" }
