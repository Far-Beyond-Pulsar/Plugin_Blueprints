[package]
name = "blueprint_compiler"
version = "0.1.0"
edition = "2021"
description = "Compiles Blueprint graphs to Pulsar engine script modules (pulsar_script_vm)."

[dependencies]
graphy-blueprint = { workspace = true }
# The Graphy submodule, like the graphy-* path dependencies: one Graphy type set for plugin and compiler.
graphy = { workspace = true }
pulsar_script_vm = { workspace = true }
serde_json = "1.0"

[dev-dependencies]
pulsar_reflection = { workspace = true }
pulsar_scenedb = { workspace = true }
