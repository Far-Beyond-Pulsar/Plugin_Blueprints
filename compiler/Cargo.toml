[package]
name = "blueprint_compiler"
version = "0.1.0"
edition = "2021"
description = "Compiles Blueprint graphs to Pulsar engine script modules (pulsar_script_vm)."

[dependencies]
blueprint_graph = { path = "../graph" }
# Same Graphy revision as the plugin; Pulsar-Native patches both to its submodule.
graphy = { git = "https://github.com/Far-Beyond-Pulsar/Graphy", rev = "c43924070aa0955302f8015708625be279da77a7" }
pulsar_script_vm = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3746651e5df5157078e3d911a3d2cb35a363f52b" }
serde_json = "1.0"

[dev-dependencies]
pulsar_reflection = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection", rev = "2dab12bfb147d813e508e1db0b5220ba9ba167ae" }
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "685b1b0aa212b64912549efd583c93480bea027f" }
