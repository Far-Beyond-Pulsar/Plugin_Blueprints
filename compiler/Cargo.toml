[package]
name = "blueprint_compiler"
version = "0.1.0"
edition = "2021"
description = "Compiles Blueprint graphs to Pulsar engine script modules (pulsar_script_vm)."

[dependencies]
# Same Graphy revision as the plugin; Pulsar-Native patches both to its submodule.
graphy = { git = "https://github.com/Far-Beyond-Pulsar/Graphy", rev = "c43924070aa0955302f8015708625be279da77a7" }
pulsar_script_vm = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "a4f321636bb120e13ceab6d925e00676138915d2" }
serde_json = "1.0"

[dev-dependencies]
pulsar_reflection = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection", rev = "3daa98e" }
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "0801d2638a66b81692df6a03130c3dcf1b3f1dbf" }
