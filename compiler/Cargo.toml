[package]
name = "blueprint_compiler"
version = "0.1.0"
edition = "2021"
description = "Compiles Blueprint graphs to Pulsar engine script modules (pulsar_script_vm)."

[dependencies]
graphy-blueprint = { path = "../../../../crates/third-party/graphy/crates/graphy-blueprint" }
# Same Graphy revision as the plugin; Pulsar-Native patches both to its submodule.
graphy = { git = "https://github.com/Far-Beyond-Pulsar/Graphy", rev = "c43924070aa0955302f8015708625be279da77a7" }
pulsar_script_vm = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3ffbecda91982c3997ebff801c5b872df0a455ef" }
serde_json = "1.0"

[dev-dependencies]
pulsar_reflection = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3ffbecda91982c3997ebff801c5b872df0a455ef" }
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "017252c3c84331a29e53eaa627185597954a3241" }
