[package]
name = "blueprint_compiler"
version = "0.1.0"
edition = "2021"
description = "Compiles Blueprint graphs to Pulsar engine script modules (pulsar_script_vm)."

[dependencies]
graphy-blueprint = { path = "../../../../crates/third-party/graphy/crates/graphy-blueprint" }
# The Graphy submodule, like the graphy-* path dependencies: one Graphy type set for plugin and compiler.
graphy = { path = "../../../../crates/third-party/graphy" }
pulsar_script_vm = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3e11097f4ec51e0b4d18ec3148c33ff78cf116fc" }
serde_json = "1.0"

[dev-dependencies]
pulsar_reflection = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "3e11097f4ec51e0b4d18ec3148c33ff78cf116fc" }
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "017252c3c84331a29e53eaa627185597954a3241" }
