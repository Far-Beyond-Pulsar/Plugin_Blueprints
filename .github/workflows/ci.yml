name: CI

# This plugin builds as part of the Pulsar-Native workspace: its crates use
# `workspace = true` dependencies and Helio comes from Pulsar's submodule. CI
# checks out Pulsar-Native with its submodules, puts this commit at the
# path Pulsar vendors the plugin under, and checks this plugin's own packages
# the way Pulsar's CI checks its own (rustfmt, clippy, nextest's `ci` profile,
# which leaves out the suites that render real frames).
#
# Pulsar's CI does not format-check submodules (scripts/fmt-check.sh), so the
# rustfmt check of this code lives here. Pulsar's CI still lints and tests it
# when Pulsar pins a new commit.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PLUGIN_DIR: plugins/vendor/blueprint_editor
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # No debuginfo: the test binaries link the whole renderer.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: rustfmt, clippy and tests (linux)
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # A change that spans repositories uses one branch name in each (the
      # rewrite's batches are rewrite/pN-* everywhere): build against
      # Pulsar-Native's branch of the same name when it has one, so its pins
      # (Helio, the other plugins) match; otherwise against its main.
      - name: Pick the Pulsar-Native branch
        id: pulsar
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/Far-Beyond-Pulsar/Pulsar-Native "refs/heads/$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Far-Beyond-Pulsar/Pulsar-Native
          ref: ${{ steps.pulsar.outputs.ref }}
          submodules: recursive
          persist-credentials: false
          path: pulsar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: pulsar/${{ env.PLUGIN_DIR }}

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
          cache-workspaces: pulsar

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libglib2.0-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxkbcommon-x11-0 libxkbcommon-x11-dev libasound2-dev libudev-dev \
            clang libclang-dev \
            mesa-vulkan-drivers

      # This plugin's packages: the workspace members under its path.
      - name: Find this plugin's packages
        working-directory: pulsar
        run: |
          packages=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg dir "$PWD/$PLUGIN_DIR/" '.packages[] | select(.manifest_path | startswith($dir)) | "-p " + .name' \
            | tr '\n' ' ')
          test -n "$packages"
          echo "PACKAGES=$packages" >> "$GITHUB_ENV"
          echo "$packages"
          # The plugin's root crate registers its editor contributions behind
          # its `editor` feature: check and test them too.
          root=$(sed -n 's/^root = "\(.*\)"/\1/p' "$PLUGIN_DIR/pulsar-plugin.toml")
          if [ -n "$root" ] && ! grep -q '^editor_only = true' "$PLUGIN_DIR/pulsar-plugin.toml"; then
            echo "ROOT_FEATURES=--features $root/editor" >> "$GITHUB_ENV"
          fi

      - name: rustfmt
        working-directory: pulsar
        run: |
          # shellcheck disable=SC2086 # one -p per word
          cargo fmt $PACKAGES -- --check

      # The allow-list is Pulsar-Native's (its ci.yml).
      - name: clippy (includes cargo check)
        working-directory: pulsar
        run: |
          # shellcheck disable=SC2086 # one -p per word
          cargo clippy $PACKAGES $ROOT_FEATURES --all-targets -- \
            -A warnings \
            -A dead_code \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity \
            -A clippy::match_like_matches_macro \
            -A clippy::only_used_in_recursion \
            -A improper_ctypes_definitions \
            -A clippy::field_reassign_with_default \
            -A clippy::result_large_err \
            -A clippy::doc_overindented_list_items

      - name: Install nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: nextest

      # Pulsar's `ci` profile (.config/nextest.toml) leaves out the suites that
      # render real frames; run those on a GPU machine.
      - name: Tests
        working-directory: pulsar
        timeout-minutes: 60
        run: |
          # shellcheck disable=SC2086 # one -p per word
          cargo nextest run --profile ci $PACKAGES $ROOT_FEATURES --no-fail-fast --no-tests=pass
